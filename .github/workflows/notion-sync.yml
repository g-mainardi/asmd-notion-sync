name: Sync

# Every 15 minutes, off the hour when GitHub's scheduler is busiest
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node sync.mjs
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
