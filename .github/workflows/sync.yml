name: Sync

# Every 15 minutes, off the hour when GitHub's scheduler is busiest
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write # the keep-alive step

concurrency:
  group: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node sync.mjs
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
      # GitHub disables the schedule of a public repository after 60 days without activity: enabling the workflow
      # through the API resets the count, as gautamkrishnar/keepalive-workflow does
      - run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/sync.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
